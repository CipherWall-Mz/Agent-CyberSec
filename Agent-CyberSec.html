<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberSec Agent</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap');

  :root {
    --bg: #030a0f;
    --panel: #060f17;
    --border: #0f2a3a;
    --accent: #00e5ff;
    --accent2: #ff3c3c;
    --accent3: #39ff14;
    --text: #b0d4e0;
    --text-dim: #4a7a8a;
    --glow: 0 0 10px #00e5ff55, 0 0 20px #00e5ff22;
    --glow-r: 0 0 10px #ff3c3c55;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content:'';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    grid-template-rows: 60px 1fr;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* HEADER */
  header {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 24px;
    border-bottom: 1px solid var(--border);
    background: rgba(6,15,23,0.95);
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 18px;
    color: var(--accent);
    text-shadow: var(--glow);
    letter-spacing: 2px;
  }

  .logo span { color: var(--accent2); }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent3);
    box-shadow: 0 0 8px var(--accent3);
    animation: pulse 2s infinite;
    margin-left: auto;
  }

  .status-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--accent3);
    letter-spacing: 1px;
  }

  @keyframes pulse {
    0%,100%{opacity:1} 50%{opacity:0.3}
  }

  /* SIDEBAR */
  .sidebar {
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto;
    padding: 12px 0;
  }

  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); }

  .section-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 2px;
    padding: 12px 16px 6px;
    text-transform: uppercase;
  }

  .prompt-btn {
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    border-left: 2px solid transparent;
    padding: 10px 16px;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 13px;
    font-weight: 400;
    line-height: 1.3;
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .prompt-btn:hover {
    background: rgba(0,229,255,0.05);
    border-left-color: var(--accent);
    color: var(--accent);
  }

  .prompt-btn.active {
    background: rgba(0,229,255,0.08);
    border-left-color: var(--accent);
    color: var(--accent);
  }

  .prompt-btn .tag {
    font-size: 9px;
    font-family: 'Share Tech Mono', monospace;
    padding: 2px 5px;
    border-radius: 2px;
    white-space: nowrap;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .tag-red { background: rgba(255,60,60,0.15); color: var(--accent2); border: 1px solid rgba(255,60,60,0.3); }
  .tag-cyan { background: rgba(0,229,255,0.1); color: var(--accent); border: 1px solid rgba(0,229,255,0.25); }
  .tag-green { background: rgba(57,255,20,0.1); color: var(--accent3); border: 1px solid rgba(57,255,20,0.25); }
  .tag-yellow { background: rgba(255,220,0,0.1); color: #ffd700; border: 1px solid rgba(255,220,0,0.25); }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 8px 16px;
  }

  /* MAIN */
  .main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* PROMPT DISPLAY */
  .prompt-display {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
  }

  .prompt-display::-webkit-scrollbar { width: 3px; }
  .prompt-display::-webkit-scrollbar-thumb { background: var(--border); }

  .welcome-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    opacity: 0.5;
  }

  .welcome-screen .big-icon {
    font-size: 48px;
    filter: grayscale(0.5);
  }

  .welcome-screen p {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
    text-align: center;
  }

  .prompt-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }

  @keyframes slideIn {
    from { opacity:0; transform: translateY(10px); }
    to   { opacity:1; transform: translateY(0); }
  }

  .prompt-card-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .prompt-card-title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.5px;
  }

  .prompt-card-body {
    padding: 20px;
  }

  .prompt-card-body h4 {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 2px;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .prompt-card-body p {
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .prompt-text-box {
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 16px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    color: #cfe8f0;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    position: relative;
    margin-bottom: 16px;
  }

  .prompt-text-box .hl-cyan { color: var(--accent); }
  .prompt-text-box .hl-red { color: var(--accent2); }
  .prompt-text-box .hl-green { color: var(--accent3); }
  .prompt-text-box .hl-yellow { color: #ffd700; }

  .copy-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    padding: 4px 10px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .copy-btn:hover { background: rgba(0,229,255,0.2); }
  .copy-btn.copied { color: var(--accent3); border-color: var(--accent3); background: rgba(57,255,20,0.1); }

  .tips-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 16px;
  }

  .tip-card {
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 12px;
  }

  .tip-card .tip-title {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 1px;
    margin-bottom: 6px;
  }

  .tip-card p {
    font-size: 12px;
    color: var(--text-dim);
    margin: 0;
  }

  /* CHAT AREA */
  .chat-area {
    border-top: 1px solid var(--border);
    background: var(--panel);
  }

  .chat-messages {
    max-height: 220px;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .chat-messages::-webkit-scrollbar { width: 3px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); }

  .msg {
    display: flex;
    gap: 10px;
    animation: slideIn 0.2s ease;
  }

  .msg-avatar {
    width: 28px;
    height: 28px;
    border-radius: 3px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }

  .msg-avatar.user { background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2); }
  .msg-avatar.bot  { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.2); }

  .msg-content {
    flex: 1;
  }

  .msg-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .msg-text {
    font-size: 13px;
    color: var(--text);
    line-height: 1.5;
    background: rgba(0,0,0,0.2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 8px 12px;
    font-family: 'Share Tech Mono', monospace;
  }

  .msg-text.bot-msg {
    border-color: rgba(255,60,60,0.2);
    white-space: pre-wrap;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 8px 12px;
    background: rgba(0,0,0,0.2);
    border: 1px solid rgba(255,60,60,0.2);
    border-radius: 3px;
    width: fit-content;
  }

  .typing-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--accent2);
    animation: blink 1.2s infinite;
  }
  .typing-dot:nth-child(2){animation-delay:.3s}
  .typing-dot:nth-child(3){animation-delay:.6s}

  @keyframes blink {
    0%,100%{opacity:0.2} 50%{opacity:1}
  }

  .chat-input-row {
    display: flex;
    gap: 10px;
    padding: 12px 16px;
    border-top: 1px solid var(--border);
  }

  .chat-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 10px 14px;
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }

  .chat-input:focus { border-color: rgba(0,229,255,0.4); }
  .chat-input::placeholder { color: var(--text-dim); }

  .send-btn {
    background: rgba(0,229,255,0.1);
    border: 1px solid rgba(0,229,255,0.3);
    color: var(--accent);
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 10px 20px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  .send-btn:hover { background: rgba(0,229,255,0.2); box-shadow: var(--glow); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .use-prompt-btn {
    background: rgba(57,255,20,0.1);
    border: 1px solid rgba(57,255,20,0.3);
    color: var(--accent3);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    padding: 8px 16px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  .use-prompt-btn:hover { background: rgba(57,255,20,0.2); }

  .error-msg {
    font-size: 12px;
    color: var(--accent2);
    font-family: 'Share Tech Mono', monospace;
    padding: 6px 12px;
    background: rgba(255,60,60,0.08);
    border: 1px solid rgba(255,60,60,0.2);
    border-radius: 3px;
  }
</style>
</head>
<body>

<div class="layout">
  <header>
    <div class="logo">CYBER<span>SEC</span>_AGENT</div>
    <span style="font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--text-dim);letter-spacing:1px;">v2.0 // ETHICAL HACKING PROMPTS</span>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px;">
      <span class="status-label">ONLINE</span>
      <div class="status-dot"></div>
    </div>
  </header>

  <aside class="sidebar">
    <div class="section-label">// RECONOCIMIENTO</div>
    <button class="prompt-btn" onclick="showPrompt('recon_nmap')">

    </button>
    <button class="prompt-btn" onclick="showPrompt('recon_web')">
      <span class="tag tag-cyan">WEB</span> Enumeración Web
    </button>
    <button class="prompt-btn" onclick="showPrompt('recon_dns')">
      <span class="tag tag-cyan">DNS</span> DNS Enumeration
    </button>
    <button class="prompt-btn" onclick="showPrompt('osint')">
      <span class="tag tag-yellow">OSINT</span> OSINT Target
    </button>

    <div class="divider"></div>
    <div class="section-label">// EXPLOTACIÓN WEB</div>
    <button class="prompt-btn" onclick="showPrompt('sqli')">
      <span class="tag tag-red">CRÍTICO</span> SQL Injection
    </button>
    <button class="prompt-btn" onclick="showPrompt('xss')">
      <span class="tag tag-red">ALTA</span> XSS Hunting
    </button>
    <button class="prompt-btn" onclick="showPrompt('ssrf')">
      <span class="tag tag-red">ALTA</span> SSRF Bypass
    </button>
    <button class="prompt-btn" onclick="showPrompt('lfi')">
      <span class="tag tag-red">ALTA</span> LFI / Path Traversal
    </button>
    <button class="prompt-btn" onclick="showPrompt('ssti')">
      <span class="tag tag-red">ALTA</span> SSTI Detection
    </button>

    <div class="divider"></div>
    <div class="section-label">// ACTIVE DIRECTORY</div>
    <button class="prompt-btn" onclick="showPrompt('kerberoast')">
      <span class="tag tag-red">ALTA</span> Kerberoasting
    </button>
    <button class="prompt-btn" onclick="showPrompt('asrep')">
      <span class="tag tag-red">ALTA</span> AS-REP Roasting
    </button>
    <button class="prompt-btn" onclick="showPrompt('bloodhound')">
      <span class="tag tag-yellow">ENUM</span> BloodHound AD
    </button>
    <button class="prompt-btn" onclick="showPrompt('pth')">
      <span class="tag tag-red">ALTA</span> Pass-the-Hash
    </button>

    <div class="divider"></div>
    <div class="section-label">// ESCALADA PRIVILEGIOS</div>
    <button class="prompt-btn" onclick="showPrompt('privesc_linux')">
      <span class="tag tag-green">LINUX</span> Linux PrivEsc
    </button>
    <button class="prompt-btn" onclick="showPrompt('privesc_win')">
      <span class="tag tag-yellow">WIN</span> Windows PrivEsc
    </button>
    <button class="prompt-btn" onclick="showPrompt('suid')">
      <span class="tag tag-green">LINUX</span> SUID Abuse
    </button>

    <div class="divider"></div>
    <div class="section-label">// MÁQUINAS CTF</div>
    <button class="prompt-btn" onclick="showPrompt('ctf_solve')">
      <span class="tag tag-cyan">CTF</span> Resolver Máquina HTB
    </button>
    <button class="prompt-btn" onclick="showPrompt('ctf_writeup')">
      <span class="tag tag-cyan">CTF</span> Generar Writeup
    </button>
    <button class="prompt-btn" onclick="showPrompt('ctf_hints')">
      <span class="tag tag-cyan">CTF</span> Pistas sin Spoilers
    </button>

    <div class="divider"></div>
    <div class="section-label">// HERRAMIENTAS</div>
    <button class="prompt-btn" onclick="showPrompt('metasploit')">
      <span class="tag tag-yellow">TOOL</span> Metasploit Guide
    </button>
    <button class="prompt-btn" onclick="showPrompt('burp')">
      <span class="tag tag-yellow">TOOL</span> Burp Suite Workflow
    </button>
    <button class="prompt-btn" onclick="showPrompt('shell_upgrade')">
      <span class="tag tag-green">SHELL</span> Shell Upgrade
    </button>
  </aside>

  <main class="main">
    <div class="prompt-display" id="promptDisplay">
      <div class="welcome-screen">
        <div class="big-icon">⚡</div>
        <p>SELECCIONA UN PROMPT DEL PANEL IZQUIERDO<br>O ESCRIBE TU CONSULTA DIRECTAMENTE</p>
      </div>
    </div>

    <div class="chat-area">
      <div class="chat-messages" id="chatMessages"></div>
      <div class="chat-input-row">
        <textarea class="chat-input" id="chatInput" rows="2"
          placeholder="Escribe tu consulta de ciberseguridad... (Enter para enviar)"
          onkeydown="handleKey(event)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">ENVIAR ▶</button>
      </div>
    </div>
  </main>
</div>

<script>
const PROMPTS = {
  recon_nmap: {
    title: "Nmap Full Reconnaissance",
    tags: [['ENUM','cyan'],['RECONOCIMIENTO','cyan']],
    desc: "Prompt optimizado para guiarte en un escaneo completo con Nmap, interpretación de resultados y próximos pasos.",
    text: `Actúa como un experto en pentesting. Tengo un objetivo con IP [TARGET_IP] en un entorno controlado (CTF/Lab).

Necesito que me guíes en la fase de reconocimiento con Nmap:

1. Dame el comando Nmap más adecuado para:
   - Descubrir todos los puertos abiertos (TCP/UDP)
   - Detectar versiones de servicios
   - Ejecutar scripts NSE relevantes
   - Evadir firewalls básicos si es necesario

2. Cuando te muestre el output, analiza:
   - Puertos críticos y sus implicaciones
   - Versiones vulnerables conocidas (CVEs)
   - Vector de ataque más prometedor
   - Siguiente fase recomendada

Output del scan: [PEGA AQUÍ EL RESULTADO DE NMAP]`,
    tips: [
      ['REEMPLAZAR', 'Sustituye [TARGET_IP] por la IP real del laboratorio'],
      ['CONTEXTO', 'Menciona si es HTB, TryHackMe, Dockerlabs o tu propio lab'],
      ['OUTPUT', 'Pega el resultado completo de nmap para análisis profundo'],
      ['SEGUIMIENTO', 'Pide que priorice los vectores según severidad']
    ]
  },
  recon_web: {
    title: "Enumeración Web Completa",
    tags: [['WEB','cyan'],['FFUF','cyan']],
    desc: "Guía completa para enumerar directorios, subdominios, tecnologías y puntos de entrada de una aplicación web.",
    text: `Soy un pentester en un entorno autorizado. El objetivo es [TARGET_URL].

Guíame en enumeración web paso a paso:

FASE 1 - TECNOLOGÍAS:
- ¿Qué herramientas uso para fingerprinting? (Wappalyzer, whatweb, curl headers)
- ¿Qué información crítica busco en headers HTTP?

FASE 2 - DIRECTORIOS Y ARCHIVOS:
- Dame comandos ffuf/gobuster para fuzzing de directorios
- Wordlists recomendadas para este tipo de aplicación
- Extensiones de archivos a buscar según el stack tecnológico

FASE 3 - SUBDOMINIOS:
- Comandos para enumeración de subdominios (ffuf vhost mode, subfinder)

FASE 4 - ANÁLISIS DE RESULTADOS:
Cuando te muestre los hallazgos, identifica:
- Páginas de administración expuestas
- Archivos sensibles (.git, .env, backup)
- Parámetros para fuzzing posterior

Tecnología detectada: [STACK TECNOLÓGICO O "DESCONOCIDA"]
Resultados encontrados: [PEGA HALLAZGOS]`,
    tips: [
      ['TARGET', 'Incluye el stack si lo conoces (PHP, Node, Python, .NET)'],
      ['WORDLIST', 'Menciona si tienes SecLists instalado para mejores sugerencias'],
      ['ITERATIVO', 'Ve pegando resultados para análisis en tiempo real'],
      ['VIRTUAL HOST', 'Pide específicamente técnicas de vhost si es necesario']
    ]
  },
  dns: {title:'DNS'},
  sqli: {
    title: "SQL Injection Exploitation",
    tags: [['CRÍTICO','red'],['OWASP A03','red']],
    desc: "Prompt para detectar, confirmar y explotar vulnerabilidades SQLi de forma sistemática.",
    text: `Actúa como experto en SQL Injection. Estoy auditando [URL/PARÁMETRO] en un entorno autorizado.

CONTEXTO:
- Tipo de aplicación: [WEB APP / API REST]
- Base de datos sospechada: [MySQL / MSSQL / PostgreSQL / SQLite / Desconocida]
- Punto de inyección: [GET param / POST body / Header / Cookie]

FASE 1 - DETECCIÓN:
Proporciona payloads básicos de confirmación para:
- Error-based SQLi
- Boolean-based blind
- Time-based blind

FASE 2 - EXTRACCIÓN (si confirmo la vulnerabilidad):
Dame queries para extraer:
- Versión de base de datos
- Nombre de bases de datos disponibles
- Tablas de la DB objetivo
- Columnas de tabla [TABLA_OBJETIVO]
- Dump de credenciales/datos sensibles

FASE 3 - SQLMAP AUTOMATIZADO:
Dame el comando sqlmap con los flags correctos para este escenario.

Respuesta del servidor: [PEGA AQUÍ LA RESPUESTA HTTP]`,
    tips: [
      ['DB TYPE', 'El tipo de base de datos cambia radicalmente los payloads'],
      ['WAF', 'Indica si hay WAF (Cloudflare, ModSecurity) para técnicas de bypass'],
      ['UNION', 'Pide ayuda para determinar el número de columnas primero'],
      ['SQLMAP', 'Usa --level=5 --risk=3 en laboratorios para cobertura máxima']
    ]
  },
  xss: {
    title: "XSS Hunting & Exploitation",
    tags: [['ALTA','red'],['CLIENT-SIDE','red']],
    desc: "Metodología para encontrar y explotar XSS reflected, stored y DOM-based.",
    text: `Actúa como experto en XSS. Objetivo: [URL] - entorno controlado.

CONTEXTO:
- Tipo de XSS sospechado: [Reflected / Stored / DOM-based]
- Punto de inyección: [campo de búsqueda / comentarios / header / URL param]
- Protecciones detectadas: [ninguna / encoding HTML / CSP / WAF]

FASE 1 - DETECCIÓN BÁSICA:

let currentPrompt = null;
let chatHistory = [];
let isLoading = false;

function showPrompt(id) {
  const p = PROMPTS[id];
  if (!p || !p.text) return;
  currentPrompt = p;
  
  document.querySelectorAll('.prompt-btn').forEach(b => b.classList.remove('active'));
  event.currentTarget.classList.add('active');

  const tagsHtml = (p.tags || []).map(([label, color]) =>
    `<span class="tag tag-${color}">${label}</span>`
  ).join('');

  const tipsHtml = p.tips ? `
    <h4>// TIPS DE USO</h4>
    <div class="tips-grid">
      ${p.tips.map(([title, content]) => `
        <div class="tip-card">
          <div class="tip-title">[${title}]</div>
          <p>${content}</p>
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('promptDisplay').innerHTML = `
    <div class="prompt-card">
      <div class="prompt-card-header">
        <span class="prompt-card-title">${p.title}</span>
        ${tagsHtml}
      </div>
      <div class="prompt-card-body">
        <p>${p.desc}</p>
        <h4>// PROMPT TEMPLATE</h4>
        <div class="prompt-text-box" id="promptText">
          ${escapeHtml(p.text)}
          <button class="copy-btn" onclick="copyPrompt()">[ COPIAR ]</button>
        </div>
        <button class="use-prompt-btn" onclick="usePrompt()">▶ USAR ESTE PROMPT EN EL CHAT</button>
        ${tipsHtml}
      </div>
    </div>
  `;
}

function escapeHtml(text) {
  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\[([^\]]+)\]/g, '<span class="hl-cyan">[$1]</span>');
}

function copyPrompt() {
  if (!currentPrompt) return;
  navigator.clipboard.writeText(currentPrompt.text).then(() => {
    const btn = document.querySelector('.copy-btn');
    if (btn) { btn.textContent = '[ ✓ COPIADO ]'; btn.classList.add('copied'); }
    setTimeout(() => { if(btn){ btn.textContent='[ COPIAR ]'; btn.classList.remove('copied');} }, 2000);
  });
}

function usePrompt() {
  if (!currentPrompt) return;
  document.getElementById('chatInput').value = currentPrompt.text;
  document.getElementById('chatInput').focus();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function addMessage(role, text) {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg';
  const isUser = role === 'user';
  div.innerHTML = `
    <div class="msg-avatar ${isUser ? 'user' : 'bot'}">${isUser ? '👤' : '🔴'}</div>
    <div class="msg-content">
      <div class="msg-label">${isUser ? 'OPERADOR' : 'CYBERSEC_AGENT'}</div>
      <div class="msg-text ${isUser ? '' : 'bot-msg'}">${escapeHtml(text)}</div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function addTyping() {
  const container = document.getElementById('chatMessages');
  const div = document.createElement('div');
  div.className = 'msg'; div.id = 'typingMsg';
  div.innerHTML = `
    <div class="msg-avatar bot">🔴</div>
    <div class="msg-content">
      <div class="msg-label">CYBERSEC_AGENT</div>
      <div class="typing-indicator">
        <div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>
      </div>
    </div>
  `;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typingMsg');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text || isLoading) return;

  input.value = '';
  addMessage('user', text);
  chatHistory.push({ role: 'user', content: text });

  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  addTyping();

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `Eres CyberSec Agent, un experto en ciberseguridad ofensiva y defensiva especializado en entornos educativos y CTFs. Tu propósito es guiar a profesionales y estudiantes de ciberseguridad en laboratorios controlados como HackTheBox, TryHackMe, Dockerlabs y entornos de práctica propios.

ESPECIALIDADES:
- Reconocimiento y enumeración (Nmap, Gobuster, FFuf, Subdomain enum)
- Explotación web (SQLi, XSS, SSRF, LFI, SSTI, XXE, IDOR, etc.)
- Active Directory (Kerberoasting, AS-REP Roasting, BloodHound, DCSync, PtH)
- Escalada de privilegios Linux y Windows
- Buffer Overflow y exploit development básico
- Herramientas: Metasploit, Burp Suite, Impacket, CrackMapExec, Mimikatz

COMPORTAMIENTO:
- Sé técnico, preciso y directo. Usa términos técnicos correctos.
- Da comandos específicos y ejecutables, no vagos
- Explica el "por qué" técnico detrás de cada técnica
- Organiza respuestas con pasos numerados cuando corresponda
- Si te preguntan sobre algo fuera de un contexto ético/educativo claro, redirige hacia el aprendizaje legítimo
- Responde en español

Eres un mentor técnico, no solo un buscador de información. Ayuda al usuario a entender, no solo a copiar comandos.`,
        messages: chatHistory
      })
    });

    const data = await response.json();
    removeTyping();

    if (data.error) {
      addMessage('bot', `ERROR: ${data.error.message}`);
    } else {
      const reply = data.content.map(b => b.text || '').join('');
      addMessage('bot', reply);
      chatHistory.push({ role: 'assistant', content: reply });
    }
  } catch(err) {
    removeTyping();
    addMessage('bot', `ERROR DE CONEXIÓN: ${err.message}`);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
}
</script>
